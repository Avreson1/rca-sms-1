name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        # The warning count is pinned to today's 293 so new ones fail the run
        # instead of drifting in under the radar.
        run: npm run lint -- --max-warnings=293

      - name: Build
        run: npm run build
