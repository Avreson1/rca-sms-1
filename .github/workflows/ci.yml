name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run automated unit tests
        run: npx tsx --test src/lib/promotion-engine.test.ts src/lib/payment-verification.test.ts

      - name: Lint
        # Pinned with safety margin against baseline warning count
        run: npm run lint -- --max-warnings=150

      - name: Build
        run: npm run build
