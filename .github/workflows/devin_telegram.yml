name: Devin Next.js Agent & Daily Log Summary

on:
  repository_dispatch:
    types: [telegram_command]

  workflow_dispatch:
    inputs:
      direct_prompt:
        description: "One-shot instruction (leave blank for interactive Telegram session)"
        required: false
        default: ""
      session_minutes:
        description: "Interactive session minutes (max 15)"
        required: false
        default: "10"
      run_daily_summary:
        description: "Set to 'true' to test the 11 PM daily log summary right now"
        required: false
        default: "false"

  schedule:
    # Runs once daily at 11:00 PM WAT (22:00 UTC)
    - cron: '0 22 * * *'

concurrency:
  group: devin-agent-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  devin-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip, NPM & Playwright Chromium Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/ms-playwright
          key: devin-runtime-${{ runner.os }}-v1
          restore-keys: |
            devin-runtime-${{ runner.os }}-

      - name: Install Python Packages, Playwright Chromium & Cloudflared
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai PyGithub playwright
          python -m playwright install --with-deps chromium
          if ! command -v cloudflared &> /dev/null; then
            curl -fsSL --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i /tmp/cloudflared.deb
            rm -f /tmp/cloudflared.deb
          fi

      - name: Install Node Dependencies (if package.json exists)
        run: |
          if [ -f package.json ] && [ ! -d node_modules ]; then
            npm install --no-audit --no-fund
          fi

      - name: Execute Hardened Devin Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DIRECT_PROMPT: ${{ github.event.client_payload.prompt || github.event.inputs.direct_prompt }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes || '10' }}
          RUN_DAILY_SUMMARY: ${{ github.event.inputs.run_daily_summary || 'false' }}
        run: python devin_telegram_agent.py
