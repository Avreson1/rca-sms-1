# ==============================================================================
# RENDER CLOUD BLUEPRINT — Royal Crown Academy SMS
# Deploys the repository root as a Node.js web service (no Docker).
# Render assigns PORT automatically; do not pin it here.
# ==============================================================================
services:
  - type: web
    name: rca-sms
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SUPER_ADMIN_USERNAME
        sync: false
      - key: AUTH_SUPER_ADMIN_PASSWORD
        sync: false
      - key: AUTH_SUPER_ADMIN_NAME
        sync: false
      - key: AUTH_SUPER_ADMIN_STAFF_ID
        sync: false
      - key: AUTH_SUPER_ADMIN_EMAIL
        sync: false
