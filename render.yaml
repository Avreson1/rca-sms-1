# ==============================================================================
# RENDER CLOUD INFRASTRUCTURE BLUEPRINT (render.yaml)
# Service: Royal Crown Academy School Management Portal (RCA SMS)
# Target: Serverless Next.js 16 + Supabase PostgreSQL
# ==============================================================================
services:
  - type: web
    name: rca-sms
    runtime: node
    rootDir: rca-sms
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: rca-sms
          property: host
